<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #030305;
        color: rgba(255,255,255,0.7);
        font-family: 'Outfit', system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        overflow: hidden;
      }
      .container { position: relative; z-index: 1; }
      .code {
        font-size: clamp(80px, 15vw, 160px);
        font-weight: 800;
        background: linear-gradient(135deg, #00c9e0, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1;
        margin-bottom: 16px;
      }
      .message {
        font-size: clamp(16px, 3vw, 22px);
        margin-bottom: 40px;
        opacity: 0.6;
      }
      .glow {
        position: fixed;
        width: 400px;
        height: 400px;
        background: rgba(0,201,224,0.06);
        border-radius: 50%;
        filter: blur(120px);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 14px 32px;
        border-radius: 10px;
        background: linear-gradient(135deg, #00c9e0, #00a3b8);
        color: #fff;
        font-family: 'Outfit', sans-serif;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 2px 12px rgba(0,201,224,0.25);
      }
      a:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 24px rgba(0,201,224,0.35);
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="container">
      <div class="code">404</div>
      <p class="message">The page you're looking for doesn't exist.</p>
      <a href="/">Go Home</a>
    </div>
  </body>
</html>
